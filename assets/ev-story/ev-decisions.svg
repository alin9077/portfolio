<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 650" role="img" aria-labelledby="title desc">
  <title id="title">Choices, connections and blind spots in buying an EV</title>
  <desc id="desc">Three solid shapes and a selection tick: which car and trim? Two connected circles: home charging shapes your routine. An incomplete ring and question mark: claimed range is not your range.</desc>
  <rect width="650" height="650" fill="#f3f0e7"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#171917">
    <!-- Solid alternatives, with one visibly selected. -->
    <path d="M139 42C184 22 226 51 226 91C226 124 205 143 176 142C180 186 153 214 117 214C78 214 56 186 62 154C18 164 5 135 13 105C24 64 70 48 98 72C105 59 120 48 139 42Z" fill="#4289a8"/>
    <path d="m111 147 16 16 33-40" fill="none" stroke="#f3f0e7" stroke-width="12" stroke-linecap="square" stroke-linejoin="miter"/>
    <text x="292" y="64" font-size="18" letter-spacing="2">01</text>
    <text x="290" y="109" font-size="44" font-weight="800" letter-spacing="-2">Choices</text>
    <text x="292" y="153" font-size="32">Which car?</text>
    <text x="292" y="190" font-size="32">Which trim?</text>
    <!-- A physical dependency, with direction expressed by an arrow. -->
    <circle cx="66" cy="324" r="58" fill="#155c37"/>
    <path d="M39 324v-22l27-23 27 23v22H74v-21H58v21Z" fill="#f3f0e7"/>
    <path d="m117 324h52m-18-18 20 18-20 18" fill="none" stroke="#171917" stroke-width="12" stroke-linejoin="miter"/>
    <circle cx="224" cy="324" r="52" fill="#eeb500"/>
    <path d="M224 293v32l21 16" fill="none" stroke="#171917" stroke-width="9" stroke-linecap="square"/>
    <text x="292" y="265" font-size="18" letter-spacing="2">02</text>
    <text x="290" y="310" font-size="40" font-weight="800" letter-spacing="-1.8">Connections</text>
    <text x="292" y="354" font-size="32">Home charging</text>
    <text x="292" y="391" font-size="32">shapes your routine.</text>
    <!-- The missing arc is a limit in what the evidence can tell you. -->
    <path d="M175 464A78 78 0 1 0 207 568" fill="none" stroke="#eeb500" stroke-width="47"/>
    <text x="184" y="544" font-size="110" font-weight="900" fill="#ee3627">?</text>
    <text x="292" y="475" font-size="18" letter-spacing="2">03</text>
    <text x="290" y="520" font-size="44" font-weight="800" letter-spacing="-2">Blind spots</text>
    <text x="292" y="564" font-size="32">Claimed range</text>
    <text x="292" y="601" font-size="32">≠ your range.</text>
  </g>
</svg>
