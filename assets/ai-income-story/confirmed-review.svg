<svg xmlns="http://www.w3.org/2000/svg" width="1472" height="1116" viewBox="64 396 1472 1116"><style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#101114;color:#f4f1e8;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;display:grid;grid-template-rows:1fr auto;place-items:center;-webkit-font-smoothing:antialiased}
.frame{position:relative;width:min(100vw - 32px,(100vh - 96px));aspect-ratio:1;overflow:hidden;background:#f2f1ec;cursor:pointer;box-shadow:0 30px 80px -30px #000}
.frame svg{display:block;width:100%;height:100%}
svg text{font-weight:700;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
svg .disp{font-weight:700;letter-spacing:-.012em}
svg .cap{font-weight:700;letter-spacing:.2em;font-size:12px}
svg .ln{fill:none;stroke:#1b1b20;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg .dw{stroke-dasharray:1 2;stroke-dashoffset:1}
.ctl{width:min(100vw - 32px,(100vh - 96px));display:flex;align-items:center;gap:14px;padding:12px 4px 16px;font-size:13px;color:#9a9aa2;font-variant-numeric:tabular-nums}
.ctl button{font:inherit;color:#f4f1e8;background:none;border:1px solid #f4f1e8;border-radius:999px;padding:6px 14px;cursor:pointer;min-width:68px}
.ctl input{flex:1;accent-color:#e4dc64}
:focus-visible{outline:2px solid #e4dc64;outline-offset:3px}
body.render{display:block;background:#f2f1ec}
body.render .frame{width:100vw;height:100vh;box-shadow:none}
body.render .ctl{display:none}

