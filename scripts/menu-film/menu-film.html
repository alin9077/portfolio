const BPM = 120, BEAT = 60 / BPM, BEATS = 52, T = BEATS * BEAT;
const sec = (beats) => beats * BEAT;
// Playback runs 1.6× slower than the beat grid: every beat, spring and blur is stretched evenly.
const SLOW = 1.6;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const mix = (a, b, p) => a + (b - a) * p;
const smooth = (a, b, v) => { const p = clamp((v - a) / (b - a)); return p * p * (3 - 2 * p); };

// Closed-form step response of a damped spring: 0 → 1 with roughly 1% overshoot.
function spring(dt, w = 13, zeta = 0.82) {
  if (dt <= 0) return 0;
  const wd = w * Math.sqrt(1 - zeta * zeta), env = Math.exp(-zeta * w * dt);
  // Settled springs land exactly on target, so the last frame matches the first to the pixel.
  return env < 1e-5 ? 1 : 1 - env * (Math.cos(wd * dt) + (zeta * w / wd) * Math.sin(wd * dt));
}
// One spring per change, summed. keys: [[beat, value | (t) => value], ...]; values are numbers or arrays.
function springs(keys, t, w = 13, zeta = 0.82) {
  const at = (k) => (typeof keys[k][1] === 'function' ? keys[k][1](t) : keys[k][1]);
  let v = at(0), prev = v;
  v = Array.isArray(v) ? v.slice() : v;
  for (let k = 1; k < keys.length; k++) {
    const dt = t - sec(keys[k][0]);
    if (dt <= 0) break;
    const next = at(k), s = spring(dt, keys[k][2] || w, zeta);
    if (Array.isArray(v)) for (let i = 0; i < v.length; i++) v[i] += (next[i] - prev[i]) * s;
    else v += (next - prev) * s;
    prev = next;
  }
  return v;
}
// Content enters after its container starts morphing and leaves before the next morph.
function vis(t, inBeat, outBeat) {
  const tin = t - sec(inBeat);
  if (tin <= 0) return null;
  const p = clamp(tin / 0.16);
  let a = p * p * (3 - 2 * p), dy = (1 - spring(tin, 15)) * 18, blur = (1 - p) * 7;
  if (outBeat != null) {
    const tout = t - sec(outBeat);
    if (tout > 0) { const q = clamp(tout / 0.16); a *= 1 - q * q * (3 - 2 * q); dy -= q * 10; blur += q * 7; }
  }
  return a > 0.002 ? { a, dy, blur } : null;
}
const pulse = (t, beat, len = 0.32) => { const u = (t - sec(beat)) / len; return u <= 0 || u >= 1 ? 0 : Math.sin(Math.PI * u); };

    if (natA > 0) {
      ctx.fillStyle = C.ink;
      for (let i = 0; i < nat.length; i += 3) {
        const appear = t - sec(WAVES[nat[i + 2]] + hash(i) * 0.42);
        if (appear <= 0) continue;
        const [x, y] = project(t, 112 + nat[i] / 100, -44 + nat[i + 1] / 100);
        if (x < -4 || x > 1004 || y < -4 || y > 1004) continue;
        const r = 1.25 * clamp(appear / 0.14) * (1 + 0.6 * pulse(t, WAVES[nat[i + 2]] + hash(i) * 0.42, 0.22));
        ctx.globalAlpha = v.a * natA * 0.62; ctx.fillRect(x - r, y - r, r * 2, r * 2);
      }
      ctx.globalAlpha = v.a;
    }
    // Sydney: every restaurant with a menu, from a speck on the coast to the streets around Newtown.
    const loc = DATA.local || [], locA = 0.62 - 0.12 * smooth(0.5, 1, p) - 0.25 * smooth(0, 1, (t - sec(37)) / 0.4), size = mix(1.25, 2.2, smooth(0.4, 1, p));
    ctx.fillStyle = C.ink;
    for (let i = 0; i < loc.length; i += 2) {
      const appear = t - sec(WAVES[0] + hash(i + 7) * 0.42);
      if (appear <= 0) continue;
      const [x, y] = project(t, 150 + loc[i] / 1e4, -34.5 + loc[i + 1] / 1e4);
      if (x < -4 || x > 1004 || y < -4 || y > 1004) continue;
      const r = size * clamp(appear / 0.14);
      ctx.globalAlpha = v.a * locA;
      if (r > 1.6) { ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); } else ctx.fillRect(x - r, y - r, r * 2, r * 2);
    }
    ctx.globalAlpha = v.a;
    layer(vis(t, 36.5, null), () => SUBURBS.forEach(([name, lng, lat]) => { const [x, y] = project(t, lng, lat); text(name, x, y, 12.5, 600, '#8c897e', 'center', 0.12); }));
    CLUSTERS.forEach(([n, lng, lat], i) => {
      const inB = 37 + (i < 8 ? 0 : i < 12 ? 0.5 : 1), cv = vis(t, inB, null);
      if (!cv) return;
      const [x, y] = project(t, lng, lat), s = spring(t - sec(inB), 14, 0.7);
      const r = (n === 1 ? 7 : 15 + Math.sqrt(n) * 1.5) * s;
      ctx.save(); ctx.globalAlpha *= cv.a;
      ctx.beginPath(); ctx.arc(x, y, r + 2.5, 0, 7); ctx.fillStyle = '#fff'; ctx.fill();
      ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fillStyle = C.ink; ctx.fill();
      if (n > 1) text(String(n), x, y + 5, n > 99 ? 15 : 14, 600, '#fff', 'center', 0);
      ctx.restore();
    });
  });
}

/* ── Results ────────────────────────────────────────────────────────────────── */
const rowTop = (i) => 168 + i * 104;
function drawList(t, v) {
  layer(v, () => {
    text('Ramen', 44, 82, 42, 600, C.ink, 'left', -0.03);
    text('6 places · within 2 km', 44, 118, 16, 400, C.muted, 'left', 0);
    const hover = vis(t, 43.5, null);
    if (hover) { ctx.save(); ctx.globalAlpha *= hover.a; rrect(20, rowTop(0) + 6, 800, 92, 14); ctx.fillStyle = '#f2f1eb'; ctx.fill(); ctx.restore(); }
    RESULTS.forEach(([name, dish, price, dist], i) => layer(vis(t, 40.5 + i * 0.5, null), () => {
      const y = rowTop(i);

      text(dist, 796, y + 46, 16, 400, C.muted, 'right', 0);
      text(price, 796, y + 78, 22, 600, C.ink, 'right', -0.01);

  });
}

/* ── The match ──────────────────────────────────────────────────────────────── */

    layer(vis(t, 46.5, null), () => { text('292 King St, Sydney, NSW, 2042', 48, 324, 18, 400, '#bdbaad', 'left', 0); text('174 m away', 80, 392, 19, 500, C.paper, 'left', 0); });
    layer(vis(t, 47, null), () => {

      ctx.beginPath(); ctx.moveTo(48 + w + 9, 469); ctx.lineTo(48 + w + 19, 459); ctx.moveTo(48 + w + 11, 459); ctx.lineTo(48 + w + 19, 459); ctx.lineTo(48 + w + 19, 467); ctx.stroke();
      ctx.fillStyle = 'rgba(244,241,232,.45)'; ctx.fillRect(48, 480, w + 24, 1.4);
    });
  });
}

/* ── States: when each card arrives, when its content enters and leaves ─────── */
const STATES = [
  { s: S.logo, at: -99, out: 2, draw: drawLogo },
  { s: S.phone, at: 2.5, out: 10, draw: drawPhone },
  { s: S.search, at: 10.5, out: 16, draw: drawSearch },
  { s: S.collect, at: 16.5, out: 22, draw: drawCollect },
  { s: S.read, at: 22.5, out: 29, draw: drawRead },
  { s: S.nation, at: 29.5, out: 39, draw: drawMap },
  { s: S.list, at: 39.5, out: 44, draw: drawList },
  { s: S.match, at: 44.5, out: 49, draw: drawMatch },
  { s: S.logo, at: 49.5, out: null, draw: drawLogo }
];

/* ── The accent: one terracotta dot that travels through the story ─────────── */
const LOGO_DOT = () => { const g = logoGeometry(); return [...at(S.logo, ...g.dot), 7.2]; };
const ACCENT = () => [
  [0, LOGO_DOT()],
  [2.5, [...at(S.phone, 169, 748), 6]],
  [9, [...at(S.phone, 195, 748), 6]],
  [10.5, [...at(S.search, 588, 52), 50]],
  ...TILES.map((_, i) => i % 2 ? null : [tileIn(i) - 0.25, (() => { const [x, y, w] = tileBox(i + 1); return [...at(S.collect, x + w - 24, y + 24), 7]; })()]).filter(Boolean),
  [21, [...at(S.collect, 32 + 182 - 24, 34 + 24), 7]],
  [22.5, [...at(S.read, 28, 88), 7]],
  ...READ_ROWS.map((_, i) => [READ.connect(i) + 0.3, [...at(S.read, READ.priceX + 20, READ.rawY(i) - 8), 7]]),
  [27, [...at(S.read, READ.priceX + 20, READ.rowY(5) - 8), 7]],
  [28, [...at(S.read, 44, READ.rowY(4) - 8), 8]],
  [29.5, (t) => [...project(t, ...TAKE_SUSHI), 8]],
  [39.5, (() => { const w = width('174 m', 16, 400, 0); return [...at(S.list, 796 - w - 14, rowTop(0) + 40), 6]; })()],
  [44.5, [...at(S.match, 60, 385), 8]],
  [49.5, LOGO_DOT()]
];
function drawAccent(t, keys) {
  let [x, y, r] = springs(keys, t, 12);
  r *= 1 + 0.35 * pulse(t, 21) + 0.3 * pulse(t, 33) + 0.3 * pulse(t, 34) + 0.3 * pulse(t, 28.5) + 0.25 * pulse(t, 51) + 0.12 * pulse(t, 16, 0.2);
  // A soft ring marks the beats where the dot arrives somewhere that matters.
  for (const b of [21, 33, 34, 37.5, 46.5]) {
    const u = (t - sec(b)) / 0.55;
    if (u > 0 && u < 1) { ctx.strokeStyle = `rgba(200,79,55,${0.45 * (1 - u)})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, r + 4 + u * 26, 0, 7); ctx.stroke(); }
  }
  const ring = vis(t, 37, 39);
  if (ring) { ctx.beginPath(); ctx.arc(x, y, r + 3 * ring.a, 0, 7); ctx.fillStyle = '#fff'; ctx.fill(); }
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fillStyle = C.accent; ctx.fill();
  const icon = vis(t, 10.9, 16);
  if (icon) drawMagnifier(x, y, r, icon.a);
  const load = vis(t, 16.1, 17.05);
  if (load) {
    const a0 = (t - sec(16)) * 9;
    ctx.save(); ctx.globalAlpha = load.a; ctx.strokeStyle = C.accent; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(x, y, r + 11, a0, a0 + 1.6 + Math.sin((t - sec(16)) * 6) * 0.5); ctx.stroke(); ctx.restore();
  }
}

/* ── Map / List tabs: each edge of the indicator rides its own spring ──────── */
function drawTabs(t) {
  const v = vis(t, 37.5, 44);
  layer(v, () => {
    const [x, y, w, h] = [704, 330, 176, 52];
    rrect(x, y, w, h, 26); ctx.fillStyle = C.white; ctx.fill(); ctx.strokeStyle = C.line; ctx.lineWidth = 1.5; ctx.stroke();
    const L = springs([[0, x + 5], [39, x + 89, 9]], t), R = springs([[0, x + 87], [39, x + w - 5, 21]], t);
    rrect(L, y + 5, R - L, h - 10, 21); ctx.fillStyle = C.ink; ctx.fill();
    const labels = () => { text('Map', x + 46, y + 32, 16, 600, ctx.__c, 'center', 0); text('List', x + 130, y + 32, 16, 600, ctx.__c, 'center', 0); };
    ctx.__c = C.ink; labels();
    ctx.save(); rrect(L, y + 5, R - L, h - 10, 21); ctx.clip(); ctx.__c = '#fff'; labels(); ctx.restore();
  });
}

/* ── The cursor: real clicks, typing and one drag ───────────────────────────── */
const OFF = [1070, 1110];
const CLICKS = [2, 9, 12, 16, 39, 44, 49];
const CURSOR = () => [
  [0, OFF], [0.5, at(S.logo, 300, 92)],
  [2.5, at(S.phone, 210, 880)], [5, at(S.phone, 120, 300)],
  [6, at(S.phone, 150, 262)], [7, at(S.phone, 172, 236)],
  [8.5, at(S.phone, 344, 430)],
  [10.5, [660, 760]], [11.5, at(S.search, 180, 66)],
  [15, at(S.search, 590, 58)],
  [16.5, [1090, 700]],
  [37.5, [930, 470]], [38, [838, 362]],
  [40.5, [800, 450]], [43, at(S.list, 520, rowTop(0) + 54)],
  [44.5, at(S.match, 420, 430)], [47.5, at(S.match, 86, 466)],
  [50, OFF]
];
let CURSOR_KEYS = null;
const cursorAt = (t) => springs(CURSOR_KEYS, t, 9.5);
function drawCursor(t) {
  const [x, y] = cursorAt(t);
  if (x > 1030 || y > 1030) return;
  const down = CLICKS.reduce((m, b) => Math.max(m, pulse(t, b - 0.08, 0.2)), 0) + (t > sec(5.5) && t < sec(8) ? 1 : 0);
  for (const b of [...CLICKS, 5.5]) {
    const u = (t - sec(b)) / 0.4;
    if (u > 0 && u < 1) { ctx.strokeStyle = `rgba(38,41,34,${0.32 * (1 - u)})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, 6 + u * 24, 0, 7); ctx.stroke(); }
  }
  ctx.save();
  ctx.translate(x, y); const s = 1.32 * (1 - 0.12 * clamp(down)); ctx.scale(s, s);
  ctx.shadowColor = 'rgba(0,0,0,.28)'; ctx.shadowBlur = 5 * PX; ctx.shadowOffsetY = 2 * PX;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 22.5); ctx.lineTo(5.4, 17.4); ctx.lineTo(9.2, 26); ctx.lineTo(12.8, 24.5); ctx.lineTo(9.1, 16.1); ctx.lineTo(16.2, 16.1); ctx.closePath();
  ctx.fillStyle = '#111'; ctx.fill(); ctx.shadowColor = 'transparent'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.lineJoin = 'round'; ctx.stroke();
  ctx.restore();
}

/* ── draw(t): everything on screen is a function of t ───────────────────────── */
let ACCENT_KEYS = null;
function draw(t) {
  t = (((t / SLOW) % T) + T) % T;
  ctx.setTransform(PX, 0, 0, PX, 0, 0);
  ctx.globalAlpha = 1; ctx.filter = 'none';
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, 1000, 1000);

  const [cx, cy, w, h, r] = springs(CARD, t, 12.5), [, , , , , R, G, B] = springs(CARD, t, 24, 0.9);
  const state = STATES.reduce((cur, st) => (t >= sec(st.at) ? st : cur), STATES[0]);
  ctx.save();
  ctx.shadowColor = 'rgba(30,28,20,.16)'; ctx.shadowBlur = 50 * PX; ctx.shadowOffsetY = 18 * PX;
  rrect(cx - w / 2, cy - h / 2, w, h, r);
  ctx.fillStyle = `rgb(${clamp(R, 0, 255)},${clamp(G, 0, 255)},${clamp(B, 0, 255)})`; ctx.fill();
  ctx.restore();

  const v = vis(t, state.at + 0.4, state.out);
  if (v) {
    ctx.save();
    rrect(cx - w / 2, cy - h / 2, w, h, r); ctx.clip();
    const z = w / state.s.nw;
    ctx.translate(cx, cy); ctx.scale(z, z); ctx.translate(-state.s.nw / 2, -state.s.nh / 2);
    state.draw(t, v);
    ctx.restore();
  }
  // ?clean: product stills for the case study, without the film's captions and cursor.
  if (!params.has('clean')) drawCaptions(t);
  drawTabs(t);
  drawAccent(t, ACCENT_KEYS);
  if (!params.has('clean')) drawCursor(t);
}

/* ── Playback (preview) and frame export (render.py) ────────────────────────── */
async function ready() {
  await Promise.all([400, 500, 600, 700].map((w) => document.fonts.load(`${w} 40px Archivo`)));
  await document.fonts.load(`700 20px ${JP}`, 'らーめん');
  ACCENT_KEYS = ACCENT(); CURSOR_KEYS = CURSOR();
}
window.film = { T: T * SLOW, BEAT: BEAT * SLOW, draw, ready: ready() };
// Average subframes across the shutter for motion blur; returns RGB bytes.
window.film.frame = function (i, fps = 60, sub = 6) {
  const n = SIZE * SIZE, acc = new Uint16Array(n * 3);
  for (let k = 0; k < sub; k++) {
    draw((i + k / sub) / fps);
    const d = ctx.getImageData(0, 0, SIZE, SIZE).data;
    for (let p = 0, q = 0; p < n * 4; p += 4, q += 3) { acc[q] += d[p]; acc[q + 1] += d[p + 1]; acc[q + 2] += d[p + 2]; }
  }
  const out = new Uint8Array(n * 3), half = sub >> 1;
  for (let q = 0; q < n * 3; q++) out[q] = (acc[q] + half) / sub;
  return out;
};
window.film.ready.then(() => {
  if (params.has('render')) return;
  const still = params.get('t');
  if (still !== null) { draw(+still); return; }
  let paused = false, origin = performance.now(), held = 0;
  addEventListener('keydown', (e) => {
    if (e.code === 'Space') { paused = !paused; if (!paused) origin = performance.now() - held * 1000; }
    if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { paused = true; held = (Math.round(held / (BEAT * SLOW) * 2) / 2 + (e.code === 'ArrowRight' ? 0.5 : -0.5)) * BEAT * SLOW; draw(held); }
  });
  const tick = (now) => { if (!paused) { held = ((now - origin) / 1000) % (T * SLOW); draw(held); } requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
});
</script>
