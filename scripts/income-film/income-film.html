const BPM = 120, BEAT = 60 / BPM, BEATS = 56, T = BEATS * BEAT;
const sec = (beats) => beats * BEAT;
// Playback runs 1.6× slower than the beat grid: every beat, spring and blur is stretched evenly.
const SLOW = 1.6;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const mix = (a, b, p) => a + (b - a) * p;

// Closed-form step response of a damped spring: 0 → 1 with roughly 1% overshoot.

  return env < 1e-5 ? 1 : 1 - env * (Math.cos(wd * dt) + (zeta * w / wd) * Math.sin(wd * dt));

// One spring per change, summed. keys: [[beat, value | (t) => value, w?], ...]; values are numbers or arrays.
function springs(keys, t, w = 13, zeta = 0.82) {
  const at = (k) => (typeof keys[k][1] === 'function' ? keys[k][1](t) : keys[k][1]);
  let v = at(0), prev = v;
  v = Array.isArray(v) ? v.slice() : v;

const ease = (a, b, t) => { const p = clamp((t - sec(a)) / (sec(b) - sec(a))); return p * p * (3 - 2 * p); };
function drawAccent(t) {
  const [x, y, w, h, r] = springs(ACCENT_KEYS, t, 12);
  const g = 1 + 0.1 * pulse(t, 3) + 0.18 * pulse(t, 8.5) + 0.12 * pulse(t, 23.1) + 0.1 * pulse(t, 36.3) + 0.08 * pulse(t, 52);
  // The sun is paint; on paper it becomes a highlighter, so the figures under it stay readable.
  const marker = ease(6.9, 7.4, t) - ease(46.3, 46.7, t);
  rrect(x - w * g / 2, y - h * g / 2, w * g, h * g, r * g);
  ctx.save(); ctx.fillStyle = C.yel;
  if (marker < 1) { ctx.globalAlpha = 1 - marker; ctx.fill(); }
  if (marker > 0) { ctx.globalAlpha = marker; ctx.globalCompositeOperation = 'multiply'; ctx.fill(); }
  ctx.restore();
}

/* ── Today / With AI: each edge of the indicator rides its own spring ───────── */
const TABS = { x: 676, y: 312, w: 232, h: 48 };
function drawTabs(t) {
  layer(vis(t, 11.6, 32), () => {
    const { x, y, w, h } = TABS;
    rrect(x, y, w, h, h / 2); ctx.fillStyle = C.chip; ctx.fill();
    const L = springs([[0, x + 5], [24, x + 105, 9]], t), R = springs([[0, x + 101], [24, x + w - 5, 21]], t);
    rrect(L, y + 5, R - L, h - 10, (h - 10) / 2); ctx.fillStyle = C.ink; ctx.fill();
    const labels = (c) => { text('Today', x + 53, y + 30, 15, 600, c, 'center', 0); text('With AI', x + 168, y + 30, 15, 600, c, 'center', 0); };
    labels(C.ink);
    ctx.save(); rrect(L, y + 5, R - L, h - 10, (h - 10) / 2); ctx.clip(); labels('#fff'); ctx.restore();
  });
}

/* ── The cursor (the banker) and a touch (the customer) ─────────────────────── */
const OFF = [1080, 1100];
const deskPt = (x, y) => at(S.desk, x, y);
const payPt = (row, x = 300) => payAt(S.desk, x, row - 5);
const CURSOR = () => {
  const rapid = Array.from({ length: 24 }, (_, k) => [19.4 + k * 0.125, k % 2 ? deskPt(CALC_AT.x + 300, calcRowY(2 + (k >> 1) % 3)) : payPt([PAY.rows.gross, PAY.rows.ord, PAY.rows.allow][(k >> 1) % 3]), 34]);
  return [
    [0, OFF], [11.6, deskPt(DESK_PAY.x + 196, DESK_PAY.y + 230)],
    [13, payPt(PAY.rows.tfn, 138)], [13.9, payPt(PAY.rows.tfn, 186), 7], [14.5, payPt(PAY.rows.tfn, 232), 7],
    [15.1, payPt(PAY.rows.ord)], [15.7, deskPt(CALC_AT.x + 300, calcRowY(0))],
    [17.1, payPt(PAY.rows.allow)], [17.7, deskPt(CALC_AT.x + 300, calcRowY(1))],
    ...rapid,
    [22.6, deskPt(CALC_AT.x + 220, CALC_AT.y + CALC_AT.h - 40)], [23.4, [TABS.x + 168, TABS.y + 30]],
    [25, [1080, 640]],
    [39.2, [1060, 760]], [40.2, at(S.review, RV.x + 250, reviewRowY(2) - 6)], [41.8, at(S.review, CONFIRM.x + 220, CONFIRM.y + 30)],
    [44.5, [1080, 860]]
  ];
};
const CLICKS = [12.5, 15.5, 16, 17.5, 18, ...DESK_CLICKS.slice(6, 30), 23, 24, 43];
let CURSOR_KEYS = null, ACCENT_KEYS = null;
const cursorAt = (t) => springs(CURSOR_KEYS, t, 9.5);
function drawCursor(t) {
  const [x, y] = cursorAt(t);
  if (x > 1030 || y > 1030) return;
  const down = CLICKS.reduce((m, b) => Math.max(m, pulse(t, b - 0.06, 0.16)), 0) + (t > sec(13.5) && t < sec(15) ? 1 : 0);
  for (const b of [...CLICKS, 13.5]) {
    const u = (t - sec(b)) / 0.4;
    if (u > 0 && u < 1) { ctx.strokeStyle = `rgba(27,27,32,${0.32 * (1 - u)})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, 6 + u * 24, 0, 7); ctx.stroke(); }
  }
  ctx.save(); ctx.translate(x, y); const s = 1.32 * (1 - 0.12 * clamp(down)); ctx.scale(s, s);
  ctx.shadowColor = 'rgba(0,0,0,.28)'; ctx.shadowBlur = 5 * PX; ctx.shadowOffsetY = 2 * PX;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 22.5); ctx.lineTo(5.4, 17.4); ctx.lineTo(9.2, 26); ctx.lineTo(12.8, 24.5); ctx.lineTo(9.1, 16.1); ctx.lineTo(16.2, 16.1); ctx.closePath();
  ctx.fillStyle = '#111'; ctx.fill(); ctx.shadowColor = 'transparent'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.lineJoin = 'round'; ctx.stroke();
  ctx.restore();
}
// The customer's tap on "Upload payslip", and the payslip flying to the bank.
function drawTouch(t) {
  const [bx, by] = at(S.phone, 125, 443), u = (t - sec(4)) / 0.5;
  if (u > -0.6 && u < 1) {
    const press = clamp(1 - Math.abs(u) * 1.6);
    ctx.beginPath(); ctx.arc(bx, by, 16, 0, 7); ctx.fillStyle = `rgba(255,255,255,${0.55 * press})`; ctx.fill();
    if (u > 0) { ctx.strokeStyle = `rgba(255,255,255,${0.7 * (1 - u)})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(bx, by, 16 + u * 30, 0, 7); ctx.stroke(); }
  }
  const f = spring(t - sec(4.6), 6.5, 0.9);
  if (f > 0 && t < sec(6.2)) {
    const [sx, sy] = at(S.phone, 32, 313), x = mix(sx, BANK[0], f), y = mix(sy, BANK[1], f) - Math.sin(Math.PI * clamp(f)) * 120, s = 1.2 - 0.7 * clamp(f);
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.rotate((1 - f) * -0.3);
    rrect(-11, -14, 22, 28, 2); ctx.fillStyle = '#fff'; ctx.fill(); ctx.strokeStyle = C.ink; ctx.lineWidth = 1.4; ctx.stroke();
    ctx.fillStyle = C.ink; ctx.fillRect(-7, -8, 9, 1.4); ctx.fillRect(-7, -2, 13, 1.3); ctx.fillRect(-7, 4, 13, 1.3);
    ctx.restore();
  }
}

/* ── draw(t): everything on screen is a function of t ───────────────────────── */
function draw(t) {
  t = (((t / SLOW) % T) + T) % T;
  ctx.setTransform(PX, 0, 0, PX, 0, 0);
  ctx.globalAlpha = 1; ctx.filter = 'none';
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, 1000, 1000);
  drawCity(t);

  const [cx, cy, w, h, r] = springs(CARD, t, 12.5), [, , , , , R, G, B] = springs(CARD, t, 24, 0.9);
  const state = STATES.reduce((cur, st) => (t >= sec(st.at) ? st : cur), STATES[0]);
  // In the city the card is a line-drawn phone; elsewhere it is a sheet with a soft shadow.
  const city = clamp(1 - spring(t - sec(7), 14) + spring(t - sec(50.5), 14));
  ctx.save();
  ctx.shadowColor = `rgba(30,28,20,${0.16 * (1 - city)})`; ctx.shadowBlur = 50 * PX; ctx.shadowOffsetY = 18 * PX;
  rrect(cx - w / 2, cy - h / 2, w, h, r);
  ctx.fillStyle = `rgb(${clamp(R, 0, 255)},${clamp(G, 0, 255)},${clamp(B, 0, 255)})`; ctx.fill();
  ctx.restore();
  if (city > 0.01) { ctx.save(); ctx.globalAlpha = city; rrect(cx - w / 2, cy - h / 2, w, h, r); ctx.strokeStyle = C.ink; ctx.lineWidth = 2.4; ctx.stroke(); ctx.restore(); }

  const v = vis(t, state.at + 0.4, state.out);
  if (v) {
    ctx.save();
    rrect(cx - w / 2, cy - h / 2, w, h, r); ctx.clip();
    const z = w / state.s.nw;
    ctx.translate(cx, cy); ctx.scale(z, z); ctx.translate(-state.s.nw / 2, -state.s.nh / 2);
    state.draw(t, v);
    ctx.restore();
  }
  drawAccent(t);
  drawCaptions(t);
  drawTabs(t);
  drawTouch(t);
  drawCursor(t);
}

/* ── Playback (preview) and frame export (render.py) ────────────────────────── */
async function ready() {
  await Promise.all([400, 500, 600, 700].map((w) => document.fonts.load(`${w} 40px Archivo`)));
  ACCENT_KEYS = ACCENT(); CURSOR_KEYS = CURSOR();
}
window.film = { T: T * SLOW, BEAT: BEAT * SLOW, draw, ready: ready() };
window.film.frame = function (i, fps = 60, sub = 6) {
  const n = SIZE * SIZE, acc = new Uint16Array(n * 3);
  for (let k = 0; k < sub; k++) {
    draw((i + k / sub) / fps);
    const d = ctx.getImageData(0, 0, SIZE, SIZE).data;
    for (let p = 0, q = 0; p < n * 4; p += 4, q += 3) { acc[q] += d[p]; acc[q + 1] += d[p + 1]; acc[q + 2] += d[p + 2]; }
  }
  const out = new Uint8Array(n * 3), half = sub >> 1;
  for (let q = 0; q < n * 3; q++) out[q] = (acc[q] + half) / sub;
  return out;
};
window.film.ready.then(() => {
  if (params.has('render')) return;
  const still = params.get('t');
  if (still !== null) { draw(+still); return; }
  let paused = false, origin = performance.now(), held = 0;
  addEventListener('keydown', (e) => {
    if (e.code === 'Space') { paused = !paused; if (!paused) origin = performance.now() - held * 1000; }
    if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { paused = true; held = (Math.round(held / (BEAT * SLOW) * 2) / 2 + (e.code === 'ArrowRight' ? 0.5 : -0.5)) * BEAT * SLOW; draw(held); }
  });
  const tick = (now) => { if (!paused) { held = ((now - origin) / 1000) % (T * SLOW); draw(held); } requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
});
</script>
</body>
